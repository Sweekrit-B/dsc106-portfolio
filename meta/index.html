<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Repository meta stats page showing commit activity and language breakdown for the portfolio.">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Repository Meta Stats">
    <meta property="og:description" content="Interactive repository statistics and commit activity visualization.">
    <title>Repository Meta Stats</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <main class="content">
        <h1>Repository Meta Stats</h1>
        <section id="chart">
            <h2>Commits by time of day</h2>
        </section>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
        <section id="stats"></section>
        <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd>
                <a href="" id="commit-link" target="_blank" rel="noreferrer"></a>
            </dd>

            <dt>Date</dt>
            <dd>
                <a href="" id="commit-date" target="_blank" rel="noreferrer"></a>
            </dd>

            <dt>Time</dt>
            <dd>
                <a href="" id="commit-time" target="_blank" rel="noreferrer"></a>
            </dd>

            <dt>Author</dt>
            <dd>
                <a href="" id="commit-author" target="_blank" rel="noreferrer"></a>
            </dd>

            <dt>Lines</dt>
            <dd>
                <a href="" id="commit-lines" target="_blank" rel="noreferrer"></a>
            </dd>
        </dl>
    </main>
</body>
</html>
